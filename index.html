<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discover | Students Business Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
body{font-family:sans-serif;max-width:520px;margin:24px auto;padding:0 16px}
h2{margin-bottom:2px}
.sub{color:#555;margin-top:0}
input,select{width:100%;padding:12px;margin:6px 0;font-size:16px;border:2px solid #ccc;border-radius:8px;box-sizing:border-box}
input:focus,select:focus{border-color:#16a34a;outline:none}
.card{border:2px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}
.card h3{margin:0 0 4px}
.card p{margin:4px 0;font-size:14px}
.cat{display:inline-block;background:#dcfce7;color:#166534;border-radius:20px;padding:2px 10px;font-size:12px}
a.wa{display:block;text-align:center;background:#111;color:#fff;padding:12px;border-radius:8px;text-decoration:none;margin-top:10px}
a.wa:active{transform:scale(.96);background:#15803d}
.nav{font-size:14px;margin-bottom:10px}
#count{color:#555;font-size:14px}
#err{color:#dc2626;font-weight:bold}
</style>
</head>
<body>
<p id="err"></p>
<div class="nav"><a href="login.html">Log in</a> | <a href="list.html">List your business</a></div>
<h2>Students Business Connect</h2>
<p class="sub">Find who you need. Be found when they need you.</p>
<input id="q" type="search" placeholder="Search: crochet, photographer, graphic designer...">
<select id="cat"><option value="">All categories</option></select>
<p id="count"></p>
<div id="results"></div>

<script>
window.onerror = function (m) { document.getElementById("err").textContent = m; };

const KEY = typeof SUPABASE_ANON_KEY !== "undefined" ? SUPABASE_ANON_KEY : SUPABASE_KEY;
const sb = supabase.createClient(SUPABASE_URL, KEY);

const qEl = document.getElementById("q");
const catEl = document.getElementById("cat");
const resultsEl = document.getElementById("results");
const countEl = document.getElementById("count");
let all = [];

function line(parent, label, value) {
  if (!value) return;
  const p = document.createElement("p");
  p.textContent = label + value;
  parent.appendChild(p);
}

function waLink(num) {
  let n = String(num || "").replace(/\D/g, "");
  if (n.startsWith("0")) n = "234" + n.slice(1);
  return "https://wa.me/" + n;
}

async function start() {
  countEl.textContent = "Loading...";
  const cats = await sb.from("categories").select("id,name").order("id");
  (cats.data || []).forEach(function (c) {
    const o = document.createElement("option");
    o.value = c.id;
    o.textContent = c.name;
    catEl.appendChild(o);
  });

  const res = await sb.from("businesses")
    .select("*, categories(name)")
    .eq("status", "approved")
    .order("created_at", { ascending: false });
  if (res.error) throw new Error(res.error.message);
  all = res.data || [];
  render();
}

function render() {
  const words = qEl.value.toLowerCase().split(" ").filter(Boolean);
  const cat = catEl.value;
  const list = all.filter(function (b) {
    if (cat && String(b.category_id) !== cat) return false;
    const text = [b.name, b.tagline, b.description, b.offerings,
      b.prices, b.location, b.categories && b.categories.name]
      .join(" ").toLowerCase();
    return words.every(function (w) { return text.includes(w); });
  });

  countEl.textContent = list.length + (list.length === 1 ? " business found" : " businesses found");
  resultsEl.innerHTML = "";
  list.forEach(function (b) {
    const card = document.createElement("div");
    card.className = "card";
    const h = document.createElement("h3");
    h.textContent = b.name;
    card.appendChild(h);
    if (b.categories) {
      const s = document.createElement("span");
      s.className = "cat";
      s.textContent = b.categories.name;
      card.appendChild(s);
    }
    line(card, "", b.tagline);
    line(card, "Offers: ", b.offerings);
    line(card, "Prices: ", b.prices);
    line(card, "Location: ", b.location);
    if (b.open_to_collab) line(card, "", "Open to collaborations");
    if (b.whatsapp) {
      const a = document.createElement("a");
      a.className = "wa";
      a.href = waLink(b.whatsapp);
      a.textContent = "Contact on WhatsApp";
      card.appendChild(a);
    }
    resultsEl.appendChild(card);
  });
}

qEl.addEventListener("input", render);
catEl.addEventListener("change", render);
start().catch(function (e) { countEl.textContent = "Error: " + e.message; });
</script>
</body>
</html>
