<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business | Students Business Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
body{font-family:sans-serif;max-width:520px;margin:24px auto;padding:0 16px}
.nav{font-size:14px;margin-bottom:14px}
.cat{display:inline-block;background:#dcfce7;color:#166534;padding:4px 10px;border-radius:20px;font-size:13px}
.tag{color:#555;margin-top:6px}
.box{border:2px solid #ddd;border-radius:12px;padding:12px;margin:12px 0}
.box h4{margin:0 0 4px}
.box p{margin:0;white-space:pre-wrap}
a.wa{display:block;text-align:center;background:#16a34a;color:#fff;padding:14px;border-radius:10px;text-decoration:none;font-weight:bold;margin:12px 0}
a.wa:active{transform:scale(.96);background:#15803d}
a.ig{display:block;text-align:center;border:2px solid #111;color:#111;padding:12px;border-radius:10px;text-decoration:none}
#msg{color:#dc2626;font-weight:bold}
</style>
</head>
<body>
<div class="nav"><a href="index.html">&larr; Back to Discover</a></div>
<p id="msg"></p>
<div id="biz"></div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const msg = document.getElementById("msg");
const bizEl = document.getElementById("biz");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

function section(title, text) {
  if (!text) return;
  const b = el("div", "box");
  b.appendChild(el("h4", "", title));
  b.appendChild(el("p", "", text));
  bizEl.appendChild(b);
}

function waNumber(n) {
  let d = (n || "").replace(/\D/g, "");
  if (d.startsWith("0")) d = "234" + d.slice(1);
  return d;
}

async function load() {
  const id = new URLSearchParams(location.search).get("id");
  if (!id) { msg.textContent = "No business selected."; return; }

  const res = await sb.from("businesses")
    .select("*, categories(name)")
    .eq("id", id).single();
  if (res.error || !res.data) {
    msg.textContent = "Business not found.";
    return;
  }
  const b = res.data;
  document.title = b.name + " | Students Business Connect";

  bizEl.appendChild(el("h2", "", b.name));
  if (b.categories) bizEl.appendChild(el("span", "cat", b.categories.name));
  if (b.tagline) bizEl.appendChild(el("p", "tag", b.tagline));

  section("About", b.description);
  section("What we offer", b.offerings);
  section("Prices (₦)", b.prices);
  section("Location", b.location);
  if (b.open_to_collab) section("Collaborations", "Open to collaborations");

  if (b.whatsapp) {
    const a = el("a", "wa", "Contact on WhatsApp");
    const text = "Hello, I found " + b.name + " on Students Business Connect.";
    a.href = "https://wa.me/" + waNumber(b.whatsapp) + "?text=" + encodeURIComponent(text);
    a.target = "_blank";
    bizEl.appendChild(a);
  }
  if (b.instagram) {
    const a = el("a", "ig", "Instagram: " + b.instagram);
    a.href = "https://instagram.com/" + b.instagram.replace("@", "");
    a.target = "_blank";
    bizEl.appendChild(a);
  }
}

load().catch(function (e) { msg.textContent = "Error: " + e.message; });
</script>
</body>
</html>
